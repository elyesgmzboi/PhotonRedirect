name: .NET Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'
    - name: Restore
      run: dotnet restore PhotonRedirect.csproj
    - name: Build
      run: dotnet build PhotonRedirect.csproj -c Release
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotonRedirect-bin
        path: bin/Release/net472/PhotonRedirect.dll
